name: CI Test (Pure Java, JDK 21)

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # JUnit5（Console Standalone）を取得
      - name: Download JUnit Platform Console Standalone
        run: |
          mkdir -p lib
          curl -L -o lib/junit-platform-console-standalone.jar \
            https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar

      # コンパイル（src と test を想定）testフォルダはsrcと分けた方が良いかも。
      - name: Compile sources and tests
        run: |
          mkdir -p out
          SRC_FILES=$(find src -name "*.java")
          TEST_FILES=$(find src/app/test -name "*.java" || true)
          javac -cp "lib/junit-platform-console-standalone.jar" -d out $SRC_FILES $TEST_FILES

      # テスト実行（クラスパス走査）※Junitのソースのみ。JavaFXなどは対象外。
      - name: Run unit tests
        run: |
          java -jar lib/junit-platform-console-standalone.jar \
            -cp out \
            --scan-classpath \
            --disable-banner \
            --reports-dir build/test-results

      # レポートを保存（失敗時も保存）
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: build/test-results