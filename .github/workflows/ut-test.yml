name: CI Test (Pure Java, JDK 21 with Maven deps)

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Maven 依存関係の取得とクラスパス出力
      - name: Build Maven classpath file
        run: |
          mvn -B -q dependency:build-classpath \
            -DincludeScope=test \
            -Dmdep.outputFile=cp.txt

      # ソース & テストのコンパイル（Maven依存をクラスパスに追加）
      - name: Compile sources and tests
        run: |
          mkdir -p out
          SRC_FILES=$(find src/app -name "*.java")
          TEST_FILES=$(find src/app/test -name "*.java" || true)
          javac -encoding UTF-8 \
            -cp "$(cat cp.txt)" \
            -d out \
            $SRC_FILES $TEST_FILES

      # テスト実行（JUnit4対応）
      - name: Run unit tests
        run: |
          java -cp "out:$(cat cp.txt)" \
            org.junit.runner.JUnitCore $(find src/app/test -name "*Test.java" \
              | sed 's|src/app/test/||; s|/|.|g; s|\.java$||')

      # レポート保存
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: build/test-results